name: Validate website

on:
  pull_request:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install locked dependencies
        run: npm ci
      - name: Test application behavior
        run: npm test
      - name: Prepare pinned Firestore emulator
        run: node scripts/prepare-rules-emulator.mjs
      - name: Test database rules against local demo data
        run: npm run test:rules
      - name: Build website
        run: npm run build
